name: Pruebas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: for f in server.js lib/*.js public/*.js; do node --check "$f"; done
      - name: Pruebas de reglas de negocio
        run: npm test
